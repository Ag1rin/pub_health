# Trusted Publishing to pub.dev via OIDC (no long-lived token).
# Docs: https://dart.dev/tools/pub/automated-publishing
# Maintainer guide: docs/releasing.md
#
# pub.dev tag pattern must be: v{{version}}
# Example: git tag v0.1.0 && git push origin v0.1.0
# Tag version must match the `version` field in pubspec.yaml.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # pub.dev: v{{version}}

jobs:
  publish:
    permissions:
      id-token: write # Required for OIDC authentication
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
