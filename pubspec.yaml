name: pub_health
description: >-
  Audit the dependency health of Dart and Flutter projects.
  Detect outdated, discontinued, retracted, stale, and unused
  dependencies, then generate terminal, JSON, or Markdown reports.
version: 0.1.0
repository: https://github.com/Ag1rin/pub_health
issue_tracker: https://github.com/Ag1rin/pub_health/issues
homepage: https://github.com/Ag1rin/pub_health
documentation: https://pub.dev/documentation/pub_health/latest/
topics:
  - cli
  - dependencies
  - developer-tools
  - flutter
  - dart

environment:
  sdk: ^3.5.0

executables:
  pub_health: pub_health

dependencies:
  args: ^2.5.0
  http: ^1.2.0
  path: ^1.9.0
  pub_semver: ^2.1.4
  yaml: ^3.1.2

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
